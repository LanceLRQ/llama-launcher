# Gemma 4 12B v2 Q8_0 - Coding + Agentic Edition
# 官方推荐采样：temp=1.0, top_p=0.95, top_k=64（coding 可用 temp=0 greedy）
# repeat_penalty=1.1 避免乱码/0000重复输出
model:
  name: gemma4-v2-q8
  display_name: "Gemma 4 12B v2 Q8_0 (Coding + Agentic)"
  gguf_file: gemma4/gemma4-v2-Q8_0.gguf

overrides:
  server:
    ctx_size: 262144        # 256k：12B Q8_0 ~12GB + ~7GB KV Cache，刚好装入 3090 24GB
    gpu_layers: 99
    cache_type_k: "q4_0"
    cache_type_v: "q4_0"
    flash_attention: "on"
    jinja: true             # Gemma 4 native tool call 格式，agent 使用必须开启
    no_mmap: true           # 大上下文建议关闭内存映射
    enable_thinking: true
    repeat_penalty: 1.1     # 必须设置，否则可能出现乱码或 0000 重复
    presence_penalty: 0.0
    min_p: 0.0
    top_k: 64               # Gemma 4 官方推荐 top_k=64（非 Qwen 的 20）
    top_p: 0.95
    temp: 1.0
