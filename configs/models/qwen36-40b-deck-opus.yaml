# Qwen 3.6 40B Deck Opus - 思考模式（通用任务）
model:
  name: qwen36-40b-deck-opus
  display_name: "Qwen 3.6 40B Deck Opus (Thinking - General)"
  gguf_file: qwen3.6/Qwen3.6-40B-Deck-Opus-NEO-CODE-HERE-2T-OT-Q4_K_M.gguf

overrides:
  server:
    ctx_size: 65536         # 64k 上下文，3090 24G 可用余量约 1-2GB
    gpu_layers: 85          # 40B Q4_K_M ~22GB，保留部分显存给 KV Cache
    cache_type_k: "q4_0"
    cache_type_v: "q4_0"
    flash_attention: "on"
    enable_thinking: true
    repeat_penalty: 1.0
    presence_penalty: 0.0
    min_p: 0.0
    top_k: 20
    top_p: 0.95
    temp: 0.6
